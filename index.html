<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#101010" />
  <title>Bridge Mobile Adaptation Launcher</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main class="launcher">
    <section class="phone-card">
      <p class="tag">Alpha 0.1</p>
      <h1>Bridge Mobile</h1>
      <p class="subtitle">Launcher rápido para probar una adaptación móvil de Bridge desde Safari o Chrome.</p>

      <label for="projectName">Nombre del proyecto</label>
      <input id="projectName" type="text" placeholder="Ej. Poppy Craft" autocomplete="off" />

      <button id="startBtn">Crear proyecto rápido</button>

      <div id="result" class="result hidden">
        <h2>Proyecto creado</h2>
        <p id="projectOutput"></p>
        <a href="./prototypes/mobile-json-toolbar/">Abrir editor JSON móvil</a>
      </div>
    </section>
  </main>

  <script src="./src/app.js"></script>
</body>
</html>
