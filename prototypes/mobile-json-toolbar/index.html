<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Mobile JSON Toolbar Prototype</title>
<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    padding: 12px;
    background: #1e1e1e;
    border-bottom: 1px solid #333;
    text-align: center;
}

textarea {
    flex: 1;
    width: 100%;
    background: #181818;
    color: #00ff9c;
    border: none;
    padding: 16px;
    font-size: 16px;
    resize: none;
    box-sizing: border-box;
}

.toolbar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 10px;
    background: #1a1a1a;
    border-top: 1px solid #333;
}

button {
    min-height: 48px;
    border: none;
    border-radius: 10px;
    background: #2a2a2a;
    color: white;
    font-size: 20px;
}

button:active {
    background: #444;
}
</style>
</head>
<body>
<header>
Bridge Mobile Adaptation — JSON Toolbar Prototype
</header>

<textarea id="editor" placeholder="Escribe JSON aquí..."></textarea>

<div class="toolbar">
    <button onclick="insertText('{')">{</button>
    <button onclick="insertText('}')">}</button>
    <button onclick="insertText('[')">[</button>
    <button onclick="insertText(']')">]</button>
    <button onclick="insertText(':')">:</button>
    <button onclick="insertText(',')">,</button>
    <button onclick="insertText('\"')">"</button>
    <button onclick="insertText('_')">_</button>
    <button onclick="insertText('/')">/</button>
    <button onclick="insertText('.')">.</button>
</div>

<script>
const editor = document.getElementById('editor');

function insertText(text) {
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const value = editor.value;

    editor.value = value.substring(0, start) + text + value.substring(end);

    editor.selectionStart = editor.selectionEnd = start + text.length;
    editor.focus();
}
</script>
</body>
</html>
